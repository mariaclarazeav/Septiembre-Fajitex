<style>
/* ============ Reset minimo (la pagina tambien se sirve como documento completo) ============ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img, svg { display: block; max-width: 100%; }
img { height: auto; }
button, input, textarea { font: inherit; color: inherit; }

/* ============ Tokens: tema claro completo en :root ============ */
:root {
  --crema:      #FAEFE6;
  --nata:       #FFF9F4;
  --nata-alta:  #FFFFFF;
  --nude:       #E9C7AE;
  --nude-hondo: #D2A183;
  --rojo:       #D8262C;
  --rojo-hondo: #9E1418;
  --tinta:      #2B1410;
  --tinta-sec:  #6E4A41;
  --menta:      #1B7F70;
  --menta-piso: #E4F2EF;
  --linea:      rgba(43, 20, 16, .14);
  --linea-firme:rgba(43, 20, 16, .28);
  --sombra:     0 1px 0 rgba(43,20,16,.05), 0 12px 28px rgba(43,20,16,.07);
  --sombra-alta:0 2px 0 rgba(43,20,16,.06), 0 22px 46px rgba(43,20,16,.11);

  --aprob-piso: #C7221F;
  --aprob-alto: #A81A18;
  --aprob-tinta:#FFF2E8;
  --aprob-sec:  rgba(255, 242, 232, .72);
  --aprob-linea:rgba(255, 242, 232, .26);
  --aprob-carta:#B41C1A;

  --baldosa-a:  rgba(216, 38, 44, .16);
  --baldosa-b:  rgba(233, 199, 174, .30);

  --ok:   #1B7F70;
  --alto: #C7221F;
  --corte-piso:  #145F54;
  --corte-tinta: #FFFFFF;

  --display: "Lilita One", "Baloo 2", Impact, sans-serif;
  --titular: "Baloo 2", "Trebuchet MS", sans-serif;
  --cuerpo:  "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:    "DM Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;

  --ancho: 1180px;
  --barra: 68px;
  --radio: 18px;
  --radio-chico: 10px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --crema:      #1A0E0C;
    --nata:       #241412;
    --nata-alta:  #2C1917;
    --nude:       #E9C7AE;
    --nude-hondo: #C99B7C;
    --rojo:       #FF5A50;
    --rojo-hondo: #FF8A80;
    --tinta:      #FBEDE4;
    --tinta-sec:  #C7A192;
    --menta:      #4FD2BC;
    --menta-piso: #12302C;
    --linea:      rgba(251, 237, 228, .16);
    --linea-firme:rgba(251, 237, 228, .32);
    --sombra:     0 1px 0 rgba(0,0,0,.3), 0 12px 28px rgba(0,0,0,.38);
    --sombra-alta:0 2px 0 rgba(0,0,0,.34), 0 22px 46px rgba(0,0,0,.5);

    --aprob-piso: #7E1210;
    --aprob-alto: #5E0C0B;
    --aprob-tinta:#FFEDE2;
    --aprob-sec:  rgba(255, 237, 226, .74);
    --aprob-linea:rgba(255, 237, 226, .26);
    --aprob-carta:#6E100F;

    --baldosa-a:  rgba(255, 90, 80, .17);
    --baldosa-b:  rgba(233, 199, 174, .10);

    --ok:   #4FD2BC;
    --alto: #FF8A80;
    --corte-piso:  #4FD2BC;
    --corte-tinta: #08211D;
  }
}

:root[data-theme="dark"] {
  --crema:      #1A0E0C;
  --nata:       #241412;
  --nata-alta:  #2C1917;
  --nude:       #E9C7AE;
  --nude-hondo: #C99B7C;
  --rojo:       #FF5A50;
  --rojo-hondo: #FF8A80;
  --tinta:      #FBEDE4;
  --tinta-sec:  #C7A192;
  --menta:      #4FD2BC;
  --menta-piso: #12302C;
  --linea:      rgba(251, 237, 228, .16);
  --linea-firme:rgba(251, 237, 228, .32);
  --sombra:     0 1px 0 rgba(0,0,0,.3), 0 12px 28px rgba(0,0,0,.38);
  --sombra-alta:0 2px 0 rgba(0,0,0,.34), 0 22px 46px rgba(0,0,0,.5);

  --aprob-piso: #7E1210;
  --aprob-alto: #5E0C0B;
  --aprob-tinta:#FFEDE2;
  --aprob-sec:  rgba(255, 237, 226, .74);
  --aprob-linea:rgba(255, 237, 226, .26);
  --aprob-carta:#6E100F;

  --baldosa-a:  rgba(255, 90, 80, .17);
  --baldosa-b:  rgba(233, 199, 174, .10);

  --ok:   #4FD2BC;
  --alto: #FF8A80;
  --corte-piso:  #4FD2BC;
  --corte-tinta: #08211D;
}

/* ============ Base ============ */
body {
  background: var(--crema);
  color: var(--tinta);
  font-family: var(--cuerpo);
  font-size: 17px;
  line-height: 1.62;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-family: var(--titular); font-weight: 800; line-height: 1.08; letter-spacing: -.01em; }
p { margin: 0; }
a { color: inherit; }
ul { margin: 0; padding: 0; list-style: none; }

:focus-visible { outline: 3px solid var(--rojo); outline-offset: 3px; border-radius: 4px; }

.baldosa {
  background-color: var(--baldosa-b);
  background-image:
    linear-gradient(45deg, var(--baldosa-a) 25%, transparent 25%, transparent 75%, var(--baldosa-a) 75%),
    linear-gradient(45deg, var(--baldosa-a) 25%, transparent 25%, transparent 75%, var(--baldosa-a) 75%);
  background-size: 46px 46px;
  background-position: 0 0, 23px 23px;
}

.contenedor { width: min(var(--ancho), calc(100% - 96px)); margin-inline: auto; }

.eyebrow {
  font-family: var(--mono); font-size: .74rem; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase; color: var(--rojo);
}

/* ============ Barra fija ============ */
.barra {
  position: sticky; top: 0; z-index: 60;
  background: color-mix(in srgb, var(--crema) 96%, transparent);
  backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid var(--linea);
}
.barra__fila { display: flex; align-items: center; gap: 28px; height: var(--barra); }
.barra__marca {
  display: inline-flex; align-items: center; gap: 9px;
  font-family: var(--display); font-size: 1.06rem; letter-spacing: .02em;
  text-decoration: none; white-space: nowrap;
}
.barra__marca .aspa { color: var(--rojo); font-size: .85em; }
.barra__nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.barra__link {
  font-family: var(--mono); font-size: .78rem; letter-spacing: .04em;
  text-decoration: none; padding: 7px 13px; border-radius: 999px;
  color: var(--tinta-sec); white-space: nowrap;
  transition: background-color .18s ease, color .18s ease;
}
.barra__link:hover { background: var(--nude); color: var(--tinta); }
.barra__link.activo { background: var(--rojo); color: #FFF6F0; }
.barra__link--destino { border: 1px solid var(--linea-firme); }
.barra__link--destino.activo { border-color: transparent; }
.progreso {
  position: absolute; left: 0; bottom: -1px; height: 3px;
  width: 100%; transform-origin: 0 50%; transform: scaleX(var(--avance, 0));
  background: linear-gradient(90deg, var(--nude-hondo), var(--rojo));
}

/* ============ Secciones ============ */
.seccion { padding-block: 92px; scroll-margin-top: calc(var(--barra) + 12px); }
.seccion + .seccion { border-top: 1px solid var(--linea); }
.seccion__encabezado { display: grid; grid-template-columns: 96px 1fr; gap: 28px; align-items: start; margin-bottom: 44px; }
.seccion__numero {
  font-family: var(--display); font-size: 3.6rem; line-height: .82;
  color: var(--rojo); opacity: .9;
}
.seccion__titulo { font-size: 2.55rem; }
.seccion__bajada { margin-top: 12px; font-size: 1.12rem; color: var(--tinta-sec); max-width: 62ch; }

.tarjeta {
  background: var(--nata); border: 1px solid var(--linea);
  border-radius: var(--radio); box-shadow: var(--sombra);
}

/* ============ Portada ============ */
.portada { padding-top: 64px; padding-bottom: 96px; position: relative; overflow: hidden; }
.portada__cinta {
  position: absolute; inset: 0 0 auto 0; height: 300px;
  mask-image: linear-gradient(to bottom, #000 0%, #000 42%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 42%, transparent 100%);
  pointer-events: none;
}
.portada__interior { position: relative; }
.portada__rejilla { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 56px; align-items: end; }
.portada h1 {
  font-family: var(--display); font-weight: 400;
  font-size: clamp(3.2rem, 7.2vw, 6.2rem); line-height: .88;
  letter-spacing: -.005em; margin-top: 20px; color: var(--tinta);
}
.portada h1 em { font-style: normal; color: var(--rojo); display: block; }
.portada__par {
  margin-top: 22px; font-family: var(--titular); font-weight: 700;
  font-size: 1.6rem; line-height: 1.16; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.portada__par .aspa { color: var(--rojo); font-family: var(--display); font-size: 1.35rem; }
.portada__lede { margin-top: 20px; max-width: 54ch; font-size: 1.1rem; color: var(--tinta-sec); }

.fichas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin-top: 44px; background: var(--linea); border: 1px solid var(--linea); border-radius: var(--radio); overflow: hidden; }
.ficha { background: var(--nata); padding: 18px 20px 20px; }
.ficha__clave { font-family: var(--mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-sec); }
.ficha__valor { margin-top: 6px; font-family: var(--titular); font-weight: 700; font-size: 1.06rem; line-height: 1.25; }
.ficha__valor.alerta { color: var(--rojo); }

/* ============ Marcos de imagen ============ */
.marco { margin: 0; }
.marco__lienzo {
  border: 2px solid var(--nude-hondo); border-radius: var(--radio);
  display: grid; place-items: center; text-align: center; padding: 24px;
  position: relative; overflow: hidden;
}
.marco__lienzo::after {
  content: ""; position: absolute; inset: 10px; border: 1px dashed var(--nude-hondo);
  border-radius: calc(var(--radio) - 8px); opacity: .55; pointer-events: none;
}
.marco--hero .marco__lienzo { aspect-ratio: 16 / 10; }
.marco--mood .marco__lienzo { aspect-ratio: 4 / 5; }
.marco__centro { position: relative; z-index: 1; max-width: 30ch; }
.marco__cruz { font-family: var(--display); font-size: 2rem; color: var(--rojo); line-height: 1; }
.marco__que { margin-top: 10px; font-family: var(--titular); font-weight: 800; font-size: 1.02rem; }
.marco__spec { margin-top: 6px; font-family: var(--mono); font-size: .76rem; line-height: 1.5; color: var(--tinta-sec); }
.marco__foto {
  width: 100%; height: auto; display: block; object-fit: cover;
  border: 2px solid var(--nude-hondo); border-radius: var(--radio);
  background: var(--nude);
}
.marco--hero .marco__foto { aspect-ratio: 16 / 10; }
.marco--mood .marco__foto { aspect-ratio: 4 / 5; }
.marco__pie { margin-top: 12px; font-family: var(--mono); font-size: .76rem; color: var(--tinta-sec); }

.galeria { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 36px; }
.galeria + .nota-galeria { margin-top: 18px; }
.nota-galeria { font-size: .95rem; color: var(--tinta-sec); max-width: 76ch; }

/* ============ Concepto ============ */
.concepto__rejilla { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 56px; align-items: start; }
.concepto__texto p + p { margin-top: 18px; }
.concepto__texto p:not(.frase) { max-width: 60ch; font-size: 1.08rem; }
.frase {
  font-family: var(--titular); font-weight: 800; font-size: 1.9rem; line-height: 1.16;
  border-left: 6px solid var(--rojo); padding-left: 22px; margin-bottom: 28px; max-width: 22ch;
}
.especificaciones { display: grid; gap: 14px; }
.espec { padding: 20px 22px; border-radius: var(--radio); background: var(--nata); border: 1px solid var(--linea); }
.espec__clave { font-family: var(--mono); font-size: .72rem; letter-spacing: .13em; text-transform: uppercase; color: var(--rojo); }
.espec p { margin-top: 8px; font-size: .99rem; color: var(--tinta-sec); }
.espec strong { color: var(--tinta); font-weight: 600; }

.porque { margin-top: 56px; border-radius: var(--radio); border: 1px solid var(--linea); overflow: hidden; }
.porque__titulo { font-family: var(--mono); font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; padding: 14px 22px; background: var(--nude); color: var(--tinta); }
.porque__lista { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--linea); }
.porque__item { background: var(--nata); padding: 22px; }
.porque__dato { font-family: var(--display); font-size: 1.75rem; color: var(--rojo); line-height: 1; }
.porque__item p { margin-top: 10px; font-size: .95rem; color: var(--tinta-sec); }

/* ============ Mecanica ============ */
.rutas { display: grid; gap: 20px; }
.ruta { display: grid; grid-template-columns: 128px 1fr; gap: 0; border-radius: var(--radio); overflow: hidden; border: 1px solid var(--linea); background: var(--nata); box-shadow: var(--sombra); }
.ruta__sello { background: var(--nude); display: grid; place-items: center; text-align: center; padding: 20px 12px; }
.ruta__sello span { font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--tinta); }
.ruta__sello strong { display: block; font-family: var(--display); font-size: 2.1rem; color: var(--rojo); line-height: 1; margin-bottom: 4px; }
.flujo { display: flex; align-items: stretch; gap: 0; padding: 22px; flex-wrap: nowrap; }
.nodo { flex: 0 0 auto; width: 190px; display: grid; align-content: center; gap: 4px; padding: 16px 18px; border-radius: var(--radio-chico); background: var(--nata-alta); border: 1px solid var(--linea); }
.nodo--medio { flex: 1 1 auto; width: auto; background: transparent; border: 1px dashed var(--linea-firme); }
.nodo__marca { font-family: var(--titular); font-weight: 800; font-size: 1.06rem; }
.nodo__rol { font-family: var(--mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-sec); }
.nodo__que { font-family: var(--titular); font-weight: 700; font-size: 1rem; }
.nodo__detalle { font-size: .9rem; color: var(--tinta-sec); }
.flecha { flex: 0 0 auto; align-self: center; width: 54px; height: 24px; color: var(--rojo); }
.ruta__pie { border-top: 1px solid var(--linea); padding: 12px 22px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.marca-aprob {
  font-family: var(--mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase;
  background: var(--rojo); color: #FFF6F0; padding: 4px 10px; border-radius: 999px;
}
.ruta__pie p { font-size: .92rem; color: var(--tinta-sec); }

.aviso {
  margin-top: 26px; border: 2px solid var(--rojo); border-radius: var(--radio);
  background: var(--nata); box-shadow: var(--sombra-alta); overflow: hidden;
}
.aviso__cabeza { background: var(--rojo); color: #FFF6F0; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
.aviso__cabeza strong { font-family: var(--titular); font-weight: 800; font-size: 1.18rem; }
.aviso__sello { font-family: var(--mono); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.aviso__cuerpo { padding: 22px 24px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; }
.aviso__cuerpo p { font-size: 1rem; }
.aviso__cuerpo p + p { margin-top: 12px; }
.aviso__legal { border-left: 3px solid var(--nude-hondo); padding-left: 18px; font-size: .93rem; color: var(--tinta-sec); }

.activacion { margin-top: 26px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; padding: 26px; border-radius: var(--radio); background: var(--nata); border: 1px solid var(--linea); }
.activacion h3 { font-size: 1.35rem; }
.activacion p { margin-top: 10px; color: var(--tinta-sec); }
.activacion ul { margin-top: 14px; display: grid; gap: 8px; }
.activacion li { display: flex; gap: 10px; font-size: .97rem; }
.activacion li::before { content: "◆"; color: var(--rojo); font-size: .7em; line-height: 1.9; }
.costo { border-radius: var(--radio-chico); background: var(--nude); padding: 20px; align-self: start; }
.costo__clave { font-family: var(--mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--tinta); }
.costo p { margin-top: 8px; font-size: .95rem; color: var(--tinta); }

/* ============ Paid media ============ */
.campanas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.campana { display: flex; flex-direction: column; background: var(--nata); border: 1px solid var(--linea); border-radius: var(--radio); overflow: hidden; box-shadow: var(--sombra); }
.campana__cabeza { padding: 20px 20px 18px; border-bottom: 1px solid var(--linea); background: var(--nata-alta); }
.campana__num { font-family: var(--display); font-size: 1.5rem; color: var(--rojo); line-height: 1; }
.campana__nombre { margin-top: 8px; font-size: 1.22rem; }
.campana__cuerpo { padding: 6px 20px 20px; display: grid; }
.campo { padding-block: 14px; border-bottom: 1px dashed var(--linea); }
.campo:last-child { border-bottom: 0; padding-bottom: 0; }
.campo__clave { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-sec); }
.campo__valor { margin-top: 5px; font-size: .97rem; }
.campo__valor strong { font-weight: 600; }
.campana__pie { margin-top: auto; padding: 14px 20px; background: var(--nude); font-family: var(--mono); font-size: .72rem; letter-spacing: .06em; color: var(--tinta); }
.campana--marcada { border-color: var(--rojo); box-shadow: var(--sombra-alta); }
.campana--marcada .campana__pie { background: var(--rojo); color: #FFF6F0; }

.notas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 28px; }
.nota { padding: 22px 24px; border-radius: var(--radio); border: 1px solid var(--linea); background: var(--nata); }
.nota h4 { font-size: 1.08rem; }
.nota p { margin-top: 10px; font-size: .97rem; color: var(--tinta-sec); }
.nota p strong { color: var(--tinta); font-weight: 600; }

/* ============ Mensajeria ============ */
.linea-tiempo { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 8px; }
.linea-tiempo::before { content: ""; position: absolute; top: 27px; left: 6%; right: 6%; height: 2px; background: var(--nude-hondo); }
.envio { position: relative; background: var(--nata); border: 1px solid var(--linea); border-radius: var(--radio); padding: 68px 22px 22px; box-shadow: var(--sombra); }
.envio__punto {
  position: absolute; top: 16px; left: 22px; width: 42px; height: 42px; border-radius: 50%;
  background: var(--rojo); color: #FFF6F0; display: grid; place-items: center;
  font-family: var(--display); font-size: 1.2rem; line-height: 1;
  box-shadow: 0 0 0 6px var(--crema);
}
.envio__nombre { font-size: 1.2rem; }
.envio__meta { margin-top: 12px; display: grid; gap: 10px; }
.envio__meta div { display: grid; gap: 3px; }
.envio__meta dt { font-family: var(--mono); font-size: .67rem; letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-sec); }
.envio__meta dd { margin: 0; font-size: .95rem; }
.pendiente { display: inline-block; margin-top: 8px; font-family: var(--mono); font-size: .72rem; padding: 3px 9px; border-radius: 6px; background: var(--nude); color: var(--tinta); }

/* ============ Plan B ============ */
.planb { background: var(--menta-piso); }
.planb .seccion__numero, .planb .eyebrow { color: var(--menta); }
.planb__caja { border: 2px dashed var(--menta); border-radius: var(--radio); padding: 34px; background: var(--nata); }
.giro { display: grid; grid-template-columns: 1fr 68px 1fr; align-items: center; gap: 20px; }
.giro__lado { padding: 24px; border-radius: var(--radio-chico); border: 1px solid var(--linea); background: var(--nata-alta); }
.giro__clave { font-family: var(--mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-sec); }
.giro__frase { margin-top: 10px; font-family: var(--titular); font-weight: 800; font-size: 1.4rem; line-height: 1.18; }
.giro__lado--nuevo { border-color: var(--menta); box-shadow: inset 0 0 0 1px var(--menta); }
